version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node.js 20.9 or later. Pin the current LTS for the build.
        - nvm install 22
        - nvm use 22
        - node --version
        # Deterministic install from package-lock.json.
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
